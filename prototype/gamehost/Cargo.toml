# PROTOTYPE (#6): throwaway Game Host spike. Not production code.
[package]
name = "skua-gamehost"
version = "0.0.0-prototype"
edition = "2024"
publish = false

[dependencies]
ruffle_core = { git = "https://github.com/ruffle-rs/ruffle", rev = "a1277c06e5d46c03726d813c3cc1faa49a238c54", features = ["default_font", "lzma", "default_compatibility_rules"] }
ruffle_render = { git = "https://github.com/ruffle-rs/ruffle", rev = "a1277c06e5d46c03726d813c3cc1faa49a238c54" }
ruffle_render_wgpu = { git = "https://github.com/ruffle-rs/ruffle", rev = "a1277c06e5d46c03726d813c3cc1faa49a238c54" }
ruffle_frontend_utils = { git = "https://github.com/ruffle-rs/ruffle", rev = "a1277c06e5d46c03726d813c3cc1faa49a238c54", features = ["navigator"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
async-task = "4.7.1"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
roxmltree = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
minifb = "0.28"
wgpu-hal = "=30.0.1" # patched below; read for instrumentation only
objc2 = "0.6" # #13: autorelease pool per loop iteration
wgpu = { version = "=30.0.1", features = ["counters"] } # #13: internal resource counters

[profile.release]
debug = 1

# PROTOTYPE: local patched Ruffle (see patches/). Same pin a1277c0 plus the patch.
[patch."https://github.com/ruffle-rs/ruffle"]
ruffle_render_wgpu = { path = "../../../../src/ruffle-13/render/wgpu" }
ruffle_render = { path = "../../../../src/ruffle-13/render" }
ruffle_core = { path = "../../../../src/ruffle-13/core" }
ruffle_frontend_utils = { path = "../../../../src/ruffle-13/frontend-utils" }

[patch.crates-io]
wgpu-hal = { path = "../../../../src/patched/wgpu-hal-30.0.1-13" }
