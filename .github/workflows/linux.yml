name: Linux

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # compile-as3.sh runs mxmlc, which is known to work on Java 17.
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      # The runners have no GPU: the Game Host's tests render with Mesa's lavapipe, as a Linux server without one does.
      - name: Install Mesa's software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1

      # rustup reads Skua.GameHost/rust-toolchain.toml. The toolchain goes in before rust-cache, whose key includes the rustc version.
      - name: Install the Rust toolchain
        working-directory: Skua.GameHost
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Skua.GameHost
            Skua.Tui
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # The Flex SDK and playerglobal downloads; their SHA-256 pins live in the script, so a pin change is a new key.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/skua-as3
          key: skua-as3-${{ hashFiles('Skua.AS3/compile-as3.sh') }}

      # Builds skua-gamehost and skua.swf too, through Skua.App.Engine's targets.
      - name: Build
        run: dotnet build Skua.Linux.slnf --configuration Release

      # --release reuses the dependencies the build just compiled, instead of building Ruffle again in the debug profile.
      - name: Test the Game Host
        working-directory: Skua.GameHost
        run: cargo test --release --locked

      - name: Test the TUI
        working-directory: Skua.Tui
        run: cargo test --locked

      - name: Test
        run: dotnet test Skua.Linux.slnf --configuration Release --no-build --blame-hang-timeout 5m

      # As a Linux server installs it: a self-contained publish linked from a bin folder. After the tests, as it rebuilds for the runtime.
      - name: Install with install-linux.sh
        env:
          SKUA_INSTALL_DIR: ${{ runner.temp }}/skua
          SKUA_BIN_DIR: ${{ runner.temp }}/bin
        run: |
          ./install-linux.sh
          "$SKUA_BIN_DIR/skua" --version
