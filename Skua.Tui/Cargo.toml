[package]
name = "skua-tui"
version = "0.1.0"
edition = "2024"
publish = false
description = "A terminal UI for windowless Skua Engines, over the Control Surface"

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
